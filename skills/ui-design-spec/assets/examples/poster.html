<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>画报/海报 · 范例</title>
<style>
:root{
  --bg:#fff6ee; --card:#fff; --bd:#ffd8c2;
  --txt:#3a2418; --sub:#9a7c6b;
  --grad:linear-gradient(120deg,#ff7a59,#ff4d8d 50%,#ffb648);
  --pink:#ff7a59; --mag:#ff4d8d; --mango:#ffb648;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--txt);
  font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  line-height:1.65;padding:54px 24px 80px}
.wrap{max-width:1000px;margin:0 auto}
.kick{font-size:12px;letter-spacing:3px;color:var(--mag);text-transform:uppercase}
.h1{font-size:clamp(34px,7vw,60px);line-height:1;margin:10px 0 4px;font-weight:900;letter-spacing:-1px}
.h1[contenteditable]:focus{outline:2px dashed var(--mag);border-radius:6px}
.h1 .g{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.deck{font-size:17px;color:var(--sub);max-width:640px;margin-top:12px}
.entry{display:grid;grid-template-columns:120px 1fr;gap:18px;padding:26px 0;border-top:1px solid var(--bd)}
.entry .num{font-size:64px;font-weight:900;line-height:.85;background:var(--grad);
  -webkit-background-clip:text;background-clip:text;color:transparent}
.entry .eh{font-size:22px;font-weight:900;margin:0 0 6px}
.entry .ef{color:var(--sub);font-size:14px;margin:0}
.quote{margin-top:12px;background:#fffaf4;border-left:4px solid var(--mango);
  border-radius:0 12px 12px 0;padding:10px 14px;font-size:14px;font-style:italic;color:var(--txt)}
.tag{display:inline-block;font-size:12px;padding:4px 11px;border-radius:99px;
  border:1px solid var(--bd);color:var(--mag);margin-top:10px}
.btn{display:inline-block;text-decoration:none;font-weight:800;font-size:13.5px;color:#fff;
  background:var(--grad);padding:11px 20px;border-radius:999px;margin-top:30px}
.sec-h{display:flex;align-items:baseline;gap:12px;margin:46px 0 4px}
.sec-no{font-size:13px;font-weight:900;color:var(--mag)}
.h2{font-size:25px;margin:0;font-weight:900}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
@media(max-width:820px){.grid4{grid-template-columns:repeat(2,1fr)}}
.pcard{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:15px 16px;transition:.2s}
.pcard:hover{transform:translateY(-3px);border-color:rgba(255,77,141,.5)}
.pcard h3{margin:7px 0 5px;font-size:14.5px;font-weight:800;line-height:1.35}
footer{text-align:center;color:var(--sub);font-size:12px;margin-top:54px}
</style></head><body>
<div class="wrap">
  <span class="kick">ACTIVITY · 活动画报</span>
  <h1 class="h1" contenteditable="true">把孤岛，<br><span class="g">连成一张图</span></h1>
  <p class="deck">一句话点出这场活动的情绪钩子和价值，让翻开的人三秒想看完。</p>

  <div class="sec-h"><span class="sec-no">01</span><h2>环节专栏</h2></div>
  <div class="entry">
    <div class="num">01</div><div>
      <h3 class="eh">业务图景共享 · 打破孤岛</h3>
      <p class="ef">把各部门业务图景摊开，彼此看见全貌，破除信息孤岛。</p>
      <div class="quote">「看见彼此的全貌，孤岛才连成大陆。」</div>
      <span class="tag">打破孤岛</span>
    </div>
  </div>
  <div class="entry">
    <div class="num">02</div><div>
      <h3 class="eh">战略对齐</h3>
      <p class="ef">对齐上层战略与部门方向，把"为什么打这场仗"讲透。</p>
      <div class="quote">「方向对齐了，力气才往一处使。」</div>
      <span class="tag">对齐战略</span>
    </div>
  </div>

  <div class="sec-h"><span class="sec-no">02</span><h2>目的聚焦</h2></div>
  <div class="grid4">
    <div class="pcard"><h3>解决卡点</h3></div>
    <div class="pcard"><h3>对齐战略</h3></div>
    <div class="pcard"><h3>共谈机遇</h3></div>
    <div class="pcard"><h3>提效</h3></div>
  </div>
  <a class="btn" href="#">看完整流程 →</a>
</div>
<footer>📌 本页由 yitong 沉淀整理 · 文化活动知识库</footer>
</body></html>
