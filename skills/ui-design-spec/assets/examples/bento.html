<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bento 卡片墙 · 范例</title>
<style>
:root{
  --purple:#7C3AED; --cyan:#06B6D4;
  --grad:linear-gradient(135deg,#7C3AED,#06B6D4);
  --bg:#FFFFFF; --bg2:#F8FAFC; --txt:#1E293B;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg2);color:var(--txt);
  font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  line-height:1.65;padding:40px 20px}
.wrap{max-width:1080px;margin:0 auto}
.h1{font-size:clamp(32px,5vw,40px);font-weight:700;margin:0 0 6px}
.h1[contenteditable]:focus{outline:2px dashed var(--purple);border-radius:6px}
.sub{color:#64748b;font-size:15px;margin:0 0 26px}
.bento{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:18px}
.card{background:var(--bg);border-radius:16px;padding:20px;
  box-shadow:0 8px 24px rgba(124,58,237,.08);transition:transform .22s,box-shadow .22s}
.card:hover{transform:translateY(-4px);box-shadow:0 14px 34px rgba(124,58,237,.16)}
.card h3{margin:0 0 8px;font-size:18px;font-weight:600}
.card p{margin:0;font-size:14px;color:#475569}
.pill{display:inline-block;font-size:13px;padding:4px 12px;border-radius:999px;
  background:rgba(124,58,237,.1);color:var(--purple);font-weight:600;margin-top:12px}
.btn{display:inline-block;text-decoration:none;font-weight:700;font-size:14px;color:#fff;
  background:var(--grad);padding:10px 20px;border-radius:999px;margin-top:20px}
.btn:hover{filter:brightness(1.06)}
.reveal{opacity:0;transform:translateY(12px);transition:opacity .6s,transform .6s}
.reveal.in{opacity:1;transform:none}
footer{text-align:center;color:#94a3b8;font-size:12px;margin-top:40px}
</style></head><body>
<div class="wrap">
  <h1 class="h1" contenteditable="true">活动主题 · 占位可编辑</h1>
  <p class="sub">一句话说明这个活动是干嘛的、给谁玩的。</p>
  <div class="bento">
    <div class="card reveal"><h3>环节一</h3><p>这个环节解决什么问题、怎么玩，写两行。</p><span class="pill">暖场</span></div>
    <div class="card reveal"><h3>环节二</h3><p>这个环节解决什么问题、怎么玩，写两行。</p><span class="pill">互动</span></div>
    <div class="card reveal"><h3>环节三</h3><p>这个环节解决什么问题、怎么玩，写两行。</p><span class="pill">颁奖</span></div>
    <div class="card reveal"><h3>环节四</h3><p>这个环节解决什么问题、怎么玩，写两行。</p><span class="pill">收尾</span></div>
  </div>
  <a class="btn" href="#">查看详情 →</a>
</div>
<footer>📌 本页由 yitong 沉淀整理 · 文化活动知识库</footer>
<script>
const io=new IntersectionObserver((es)=>es.forEach(e=>{if(e.isIntersecting)e.target.classList.add('in')}),{threshold:.15});
document.querySelectorAll('.reveal').forEach(el=>io.observe(el));
</script>
</body></html>
