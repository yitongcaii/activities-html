<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>面试作战卡 · y 的面试题库</title>
<style>
  :root{
    --violet:#7c5cff; --cyan:#2dd4bf; --ink:#1f2330; --muted:#6b7280;
    --bg1:#f6f3ff; --bg2:#ecfeff; --card:#ffffff; --line:#eceef5;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    color:var(--ink); background:linear-gradient(135deg,var(--bg1),var(--bg2)); min-height:100vh;
  }
  header{
    padding:38px 28px 20px; text-align:center;
    background:linear-gradient(120deg,rgba(124,92,255,.10),rgba(45,212,191,.10));
  }
  header h1{
    margin:0; font-size:30px; font-weight:800;
    background:linear-gradient(90deg,var(--violet),var(--cyan));
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  header p{margin:8px 0 0; color:var(--muted); font-size:14px;}
  .toolbar{
    position:sticky; top:0; z-index:20; backdrop-filter:blur(8px);
    background:rgba(255,255,255,.78); border-bottom:1px solid var(--line);
    padding:12px 18px; display:flex; flex-wrap:wrap; gap:8px; align-items:center; justify-content:center;
  }
  .chip{
    border:1px solid var(--line); background:#fff; color:var(--muted);
    padding:6px 13px; border-radius:999px; font-size:13px; cursor:pointer; transition:.18s; white-space:nowrap;
  }
  .chip:hover{transform:translateY(-1px);}
  .chip.active{background:linear-gradient(90deg,var(--violet),var(--cyan)); color:#fff; border-color:transparent; font-weight:600;}
  .search{
    border:1px solid var(--line); border-radius:999px; padding:7px 14px; font-size:13px; width:220px; outline:none;
  }
  .search:focus{border-color:var(--violet);}
  .grid{
    max-width:1240px; margin:0 auto; padding:26px 20px 60px;
    display:grid; grid-template-columns:repeat(auto-fill,minmax(340px,1fr)); gap:18px;
  }
  .card{
    background:var(--card); border:1px solid var(--line); border-radius:18px; padding:18px 18px 16px;
    box-shadow:0 6px 20px rgba(31,35,48,.06); opacity:0; transform:translateY(14px);
    transition:opacity .5s ease, transform .5s ease, box-shadow .2s;
  }
  .card.in{opacity:1; transform:none;}
  .card:hover{box-shadow:0 12px 30px rgba(124,92,255,.14);}
  .pill{
    display:inline-block; font-size:11px; font-weight:700; padding:3px 10px; border-radius:999px; color:#fff; margin-bottom:10px;
  }
  .q{font-size:15px; font-weight:700; line-height:1.5; margin:0 0 10px;}
  .q::before{content:"面试官 · "; color:var(--violet); font-weight:800;}
  .a{font-size:13.5px; line-height:1.75; color:#374151; white-space:pre-wrap; margin:0;}
  .a::before{content:"你的回答 · "; color:var(--cyan); font-weight:800;}
  .todo{
    background:#fff7d6; border-bottom:2px dashed #f5c518; border-radius:4px; padding:0 4px; cursor:text; color:#92400e;
  }
  .todo:focus{outline:none; background:#fde68a;}
  footer{
    text-align:center; padding:26px; color:var(--muted); font-size:12.5px; border-top:1px solid var(--line);
  }
  .count{font-size:12px; color:var(--muted); text-align:center; margin:-10px 0 0;}
</style>
</head>
<body>
<header>
  <h1>面试作战卡 · y 的面试题库</h1>
  <p>全维度 42 问 · 真实项目锚点 · 【待补】可现场填空（点黄字直接改，自动本地保存）</p>
</header>

<div class="toolbar" id="toolbar">
  <span class="chip active" data-cat="all">全部</span>
  <span class="chip" data-cat="strategy">战略级</span>
  <span class="chip" data-cat="detail">细节深挖</span>
  <span class="chip" data-cat="case">Case·业务</span>
  <span class="chip" data-cat="meta">元问题</span>
  <span class="chip" data-cat="cog">认知类</span>
  <span class="chip" data-cat="resid">残留</span>
  <span class="chip" data-cat="edge">边角</span>
  <span class="chip" data-cat="ultimate">终极死角</span>
  <span class="chip" data-cat="lowfreq">极低频</span>
  <input class="search" id="search" placeholder="搜关键词 / 项目名…" />
</div>
<div class="count" id="count"></div>

<main class="grid" id="grid"></main>

<footer>📌 本页由 yitong 备考整理 · 面试作战卡（内容基于真实项目经历，数字请回填真实值）</footer>

<script>
const CAT = {
  strategy:{label:"战略级", color:"#7c5cff"},
  detail:{label:"细节深挖", color:"#2dd4bf"},
  case:{label:"Case·业务", color:"#3b82f6"},
  meta:{label:"元问题", color:"#f59e0b"},
  cog:{label:"认知类", color:"#10b981"},
  resid:{label:"残留", color:"#ec4899"},
  edge:{label:"边角", color:"#ef4444"},
  ultimate:{label:"终极死角", color:"#8b5cf6"},
  lowfreq:{label:"极低频", color:"#64748b"}
};

const DATA = [
  // ===== 战略级 =====
  {cat:"strategy", q:"为什么看机会？为什么是现在？", a:"我不避讳看机会，但原因不是'对现状不满'——我在现团队把 HR 流程产品化、AI 文化落地几条线从 0 搭起来了，这段我很珍惜。\n我看的是'能力边界的下一步'：我现在最强的是把 HR 动作产品化、用自动化兜底执行，但想找【待补：更重数据驱动 / 更前沿 AI 应用 / 更大业务盘子】的环境放大它。\n为什么是现在——【待补：真实时间线理由】。\n关键一句：我找工作看'下一段能不能长出我长不出来的东西'，不是逃离什么。\n⚠️ 红线：全程不评价原公司 / 领导。"},
  {cat:"strategy", q:"同场还有别的 HRBP，你凭什么让我选你？", a:"如果我跟纯 HRBP 比，我多一样——产品化和自动化的脑子：我会把重复动作写成 PRD、用 MCP 编排串系统、用看板定义指标口径（答辩自动化、博闻看板都是这么长的）。\n如果我跟纯 PM 比，我多一样——我懂 HR 业务的真实痛点和人的边界：我知道哪些能自动化、哪些必须人判断（坚持审批闸门不自动发消息）。技术同学容易做成自嗨工具，我不会，因为需求是我从业务里长出来的。\n所以我卡在稀缺位：HR 业务和工具化之间的桥梁。"},
  {cat:"strategy", q:"说个你搞砸过、或方向走偏的事。", a:"我做知识采集自动化初期，为'内容丰富'把平级朋友向破冰游戏（两真一假、互画肖像）大量采进来。\n后来根因复盘发现：这类内容放领导↔员工、领导↔领导场景根本不能用——朋友玩合适、上下级玩越界。等于大半素材错位。\n我没糊弄，而是建了关系分层过滤机制：按受众权力距离分三档，平级向一律剔除，只留上下级和高管间两档，index 从 48 条砍到 25 条，宁少勿错。\n教训：HR 内容不是多就好，适配关系错了就是噪音。现在做任何采集 / 活动，第一件事先定受众分层。"},
  {cat:"strategy", q:"用 3 分钟介绍你自己。", a:"我是云技服的 HRBP，但工作方式跟传统 HRBP 不一样——我把 HR 动作当产品来做。\n基础盘负责培训、文化落地、活动，但我不满足'办完'，更关心'能不能不靠人盯'。\n转折在把新人答辩从人工建会建群、手动催跟進，重做成自动编排系统（PRD + MCP 串联 + 审批闸门）；把培训覆盖做成可定义口径的看板。\n再往上是 AI 文化：独立负责激励设计模块，搭布道师机制，推真实采纳而非热闹。\n稀缺位一句话：HR 业务和工具化之间的桥梁。下一步想把这个能力放到更重的场景。"},
  {cat:"strategy", q:"你怎么理解这个岗位？", a:"我理解是 HRBP + 产品化 / 数据驱动的复合岗，三层：\n第一，业务伙伴不是事务执行——诊断人才 / 组织痛点，不只会接需求办活动。\n第二，用数据和工具放大 HR 杠杆——同样一个人，看板定口径、自动化兜底，能覆盖十倍体量。\n第三，变革推动者——尤其 AI 落地，HR 当'采纳推手'不是工具推销员。\n这三点对应我过去三年长出的能力，不是我来适配岗位，是岗位在找我这种桥梁型的人。\n（面纯 HR 科技 PM 或企业文化岗，调换二三层权重即可。）"},
  {cat:"strategy", q:"说一件你最骄傲的事。", a:"新人答辩自动化从 0 到真实跑通。\n起点痛点：之前全人工盯几十个新人答辩节点，建会、建群、催跟进、回填看板，漏一个就是事故。\n我的核心：把整套流程产品化——写 PRD 拆可触发节点（月 1 主任务、转正前 5 天跟进、周一探活），用 MCP 串三个系统自动跑；坚持审批闸门：系统能自动准备，发不发人判断，绝不自动对外发消息。\n首例跑通是会议号 835334680 那次，目前【待补】场已稳定跑通。\n我骄傲的不是'做了系统'，是证明了 HR 最重复、易漏的动作可以被产品化且保持克制。"},
  {cat:"strategy", q:"你对 AI+HR 未来三年怎么看？别背报告。", a:"三个判断，来自我自己踩的坑：\n一、事务执行会被 Agent 吃掉，HR 升维到体验和策略——答辩自动化、看板就是预演。\n二、看板会走向预测和干预——我现在做的是'描述性'指标，下一步该是'谁有流失风险、哪个团队需介入'，从看后视镜到看前视镜。\n三、落地瓶颈在采纳不在工具——推 AI 文化最大体会是发工具容易、让人真用难。未来 HR 核心能力变'变革管理'。这也是我坚持布道师机制而非自上而下压的原因。"},
  {cat:"strategy", q:"你哪方面还需要成长？", a:"真实说一个：我从 0 搭体系很快，但单点做深做透的耐心有时不够——习惯多线并行铺框架（答辩、看板、文化周、英语角同时推），广度有了，个别项目闭环验证会拖。\n这个弱点我已用机制补：每个项目收尾强制走'数据验收闭环'——不只看办没办，看指标对不对、业务认不认。相当于给自己装刹车。\n我不觉得致命，但它提醒我下阶段比'搭得多'更重要的是'哪个值得做透'。"},
  {cat:"strategy", q:"你有什么要问我们的？", a:"我想反过来了解三件事：\n1. 这个岗位考核 / 背什么指标？确认我的产品化能力和岗位 KPI 是否同线。\n2. 团队当前最大的 HR 痛点是什么？判断我哪块能力能直接补上。\n3. 团队目前在推的数字化或 AI 相关项目是什么？看这环境是不是我真能长本事的地方。\n（薪资架构后面跟 HR 细聊，今天先聊匹配度。）"},

  // ===== 细节深挖 =====
  {cat:"detail", q:"答辩自动化系统到底是你写的还是技术写的？你干了啥？", a:"先说边界：我是需求方、验收方、编排方，代码不是我写的，这点开头讲清。\n起点痛点：之前答辩靠人工建会建群、手动催、看板回填，容易漏。\n我的核心工作是把流程产品化：写 PRD v1.1 定义全流程——月 1 日主任务触发、转正前 5 天跟进、周一探活；用 MCP 把企微 + 腾讯会议 + 看板串起来。\n关键决策：所有对外动作必须过审批闸门（wecom_gate），不自动发消息——这是我对自动化边界的判断。\n首例真实跑通会议号 835334680，【待补】场已跑通。贡献占比：需求定义 100%、验收口径 100%、代码实现 0%。我不抢技术功，但保证这东西按业务真实需要长出来。"},
  {cat:"detail", q:"你说独立负责 AI 文化落地激励设计，员工真用起来了吗？拿数据说话。", a:"我恰恰最烦'热闹'，设计的是行为激励不是活动。\n三个动作：第一，激励锚在'用 AI 真把工作干完并复盘'，不是'报了名拍了照'——这是口径，决定数据不虚。第二，搭 AI 布道师机制：从一线选愿意尝鲜的人做布道，peer 影响 peer，不是自上而下压。第三，配套积分 / 认证【待补具体机制】。\n量化：AISee 实战沙龙跑了【待补】场、【待补】人；采纳率从【待补】到【待补】。\n诚实：采纳率口径还在和业务 leader 对齐，但我定义的'采纳'是实际用 AI 完成工作任务并复盘，不是活跃点击。数据我有，口径不敢松，松了就变你说的'热闹'。"},
  {cat:"detail", q:"培训覆盖率看板人人都做，你这个有什么不一样？'剔除15分钟'谁拍的板？", a:"不一样在指标口径不在工具。\n多数看板只看参与人次，我拆成两个：去重人数和参与人次分开算——一人刷十场和十人各来一场业务含义完全不同。\n为什么剔除 <15 分钟——误点、挂机这种无效参会虚高覆盖率，用时长过滤挤掉'人到心不到'。\n人均参与深度是我定义的：总有效时长 ÷ 去重人数，衡量投入程度不是'到没到场'。\n谁拍板：口径我定义，落地前跟业务 leader 对齐过，不是单方面定。技术实现我用 Python 脚本比对源数据（学员明细）一致性，确保看板数和底层对得上。\n价值是反推覆盖盲区、指导资源投放，不只交'覆盖率 95%'的漂亮报告。"},
  {cat:"detail", q:"你推 AI 文化，技术 leader 说'我团队不需要，别来添乱'怎么处理？", a:"第一步不硬推，先诊断——真抵触、没看到价值、还是怕增负担，三种解法不同。\n如果没看到价值，拿他团队在别的活动参与数据说话，找小切口（比如先用 AI 写周报这种低风险场景），不出成绩不扩大。\n如果抵触，绝不上门推销，在他团队里找愿意尝鲜的人做布道师——peer 影响 peer 比 HR 自上而下有效得多，也是布道师机制初衷。\n边界：HR 是赋能不是考核。业务节奏我尊重，他不想全员推就服务好那几个主动的人，用结果吸引而不是 KPI 压。压出来的'采纳'也是假的。"},

  // ===== Case·业务 =====
  {cat:"case", q:"某技术团队近半年离职率异常高，给你两周怎么诊断处理？", a:"第一步不急着给方案，先拆数据：拉离职结构（主动 / 被动、司龄、职级、流向），结构告诉我普遍性还是局部性。\n第二步定性验证：挑留存和刚走的代表做 1v1，找共性。区分真问题还是噪音——某个 leader 管理问题 vs 行业挖角，解法完全不同。\n第三步分层给动作：结构性（薪酬 / 发展通道）走制度；管理性（leader 赋能）走陪跑；个体单独谈。不会一上来搞全员团建，那是掩盖。\n两点边界：两周只能出诊断和优先级排序，根治不是两周事；HR 是陪跑不是救火，最终改不改在业务 leader，我只摆事实和路径。\n（这套'先数据后定性再分层'跟我做看板、知识分层同一逻辑——HR 也得讲结构。）"},
  {cat:"case", q:"你服务的是安全产品技术团队，技术团队 HRBP 跟业务团队有何不同？", a:"最大不同是沟通语言和信任建立方式。\n技术人重逻辑、重数据、要自主，反感形式化和打鸡血式活动。我跟他们用工程师语言：给数据、给选项、说清 why，不煽情。\n落到动作：做看板、做自动化，因为他们吃'系统化、可复用'这套；推 AI 文化走布道师 peer 影响而非自上而下压，技术人最反感被'管理'。\n安全产品业务节奏紧、合规重，文化活动必须贴业务痛点才有意义——质量稳定性文化周就是贴着'稳定性'业务关键词长的，不是通用团建。\n一句话：技术团队 HRBP 得先懂他们的世界，再用他们认可的方式做 HR。"},
  {cat:"case", q:"你同时推答辩、看板、文化周、英语角，怎么保证不都做浅？", a:"坦白多线并行是常态，早期确实摊过——搭得快收尾拖。现在三层机制兜：\n第一分层：P0 主干（答辩、看板，直接产效）亲自深度跟；P1 运营（英语角 Loop）用自动化每天 10 点自动提醒不占人力；P2 储备（57 套方案池）是结构化沉淀不等同'在做'。\n第二自动化兜底低价值重复，把时间腾给高判断的事——做自动化的初心。\n第三收尾强制数据验收闭环：每个项目结束不只看办没办，看指标对不对、业务认不认，防开了头没收尾。\n现在不是做得多就浅，是用机制保证主干做透、长尾自动跑。"},

  // ===== 元问题 =====
  {cat:"meta", q:"你来之前为我们这个岗位做了哪些准备？", a:"四件，不是临时看的：\n第一重构叙事——把过去三年散的项目按'痛点→设计→结果→边界'重梳成 3 分钟讲清的主线，不是罗列事务。\n第二补齐证据——所有'待补'量化数字（场次、人数、采纳率）真实回填，确保每个主张背后有数。\n第三研究对齐——提前看贵司【待补：业务 / 团队情况】，把'HR×产品化桥梁'能力和 JD 逐条对一遍，确认不是广撒网。\n第四准备反向提问——列了想确认的 3 件事（背什么指标、最大痛点、在推的数字化项目），确保聊匹配度不是客套。\n简单说，我来不是'看看机会'，是'确认这地方是不是我下一段该长的环境'。"},
  {cat:"meta", q:"你对我们公司 / 这个业务了解多少？", a:"坦诚讲，准备分两层：\n一层业务层面——我了解贵司【待补：核心业务 / 团队定位】，也判断这类业务下 HR 最可能痛点是【待补：如人才密度 / 技术 retention / 组织扩张】。\n另一层岗位层面——把 JD 拆了，我的自动化 / 看板 / AI 落地经验能直接对应其中【待补：具体哪几条】。\n但诚实：有些内部真实情况（团队当前具体痛点）我没法提前拿到，这正是我想反向确认的部分。我不瞎编了解，但准备足够判断方向对不对。\n⚠️ 没调研别编具体数字 / 人名，诚实说'这是我想确认的'反而加分。"},
  {cat:"meta", q:"你还在看别的吗？有 offer 吗？", a:"有在看，但范围很聚焦——都围绕'HR×产品化'或'AI 落地'这条线，不是广撒网。【待补：比如还有 1–2 个在聊的方向】。\n贵司是匹配度最高的之一，因为【待补：你的核心原因】。\n时间线我给自己【待补：2–3 周】做决策，不会拖也不会匆忙。\n（平衡术：不说'只投你们'显假，也不说'面了十家'显不稳——聚焦 + 给时间线最稳。）"},
  {cat:"meta", q:"JD 里哪条你目前最没把握？", a:"如果岗位要求深度做 People Analytics 建模（比如预测流失的算法层），我当前边界是'定义指标口径和业务规则'，建模实现要依赖技术伙伴——这是我下一步想补的。\n但反过来，这正是我跟纯技术同学的区别：我保证模型解决的是真业务问题不是炫技。我不把'不会写模型'当短板藏，它清楚划在我的协作边界里。\n（选一条非核心、不致命的答，展现清醒边界——比硬撑'我都会'可信。）"},

  // ===== 认知类 =====
  {cat:"cog", q:"抛开项目，你怎么理解 HR 这个职能？价值是什么？", a:"我对 HR 理解早不是'六大模块、办活动、做跟进'那套。\n我认为 HR 是组织效能的设计师——核心就一件事：让对的人在对的位置上，且能持续成长。价值分三层：\n第一降摩擦——人岗错配、团队冲突、流程卡顿是组织内耗，HR 要系统消除；\n第二放杠杆——通过培训、工具化把个人产出放大，我用自动化兜底重复执行即此逻辑；\n第三承载文化——组织默认怎么选、怎么待人，靠 HR 把机制立住。\n落到实践：我把答辩、看板这些'执行层摩擦'用产品化降到最低，让人力回到判断和关系。所以我不把自己当'办活动的 HR'，是用系统设计释放组织效能的人。"},
  {cat:"cog", q:"企业文化你怎么理解？怎么让它落地不挂墙？", a:"我的定义很实操：文化不是口号，是组织在压力下的默认选择。\n落地只信三件事：第一行为可观察——别喊价值观，先定义'这事具体怎么做'；第二机制兜底——激励、晋升往文化靠，不然口号敌不过 KPI；第三领导以身作则——文化从上往下漏，不从下往上建。\n两个真实例子：质量稳定性文化周贴着业务真痛的'稳定性'长，不是通用团建；AI 文化落地用布道师机制让 peer 影响 peer，激励锚'真实采纳'不是报名人数。\n反面教训：早年采过平级向破冰，发现上下级场景不适用，果断按关系分层剔除——文化内容错层就是噪音，这是我较真的地方。"},
  {cat:"cog", q:"你怎么看 AI 应用？尤其在 HR 或你熟悉的领域。", a:"核心判断：AI 应用本质该增强人的判断，不是替代人的决策——这边界我划很死。\n落地方法论三步：第一找高频重复动作（答辩跟进、看板统计）最适合交 Agent；第二用编排兜底执行（MCP 串企微、会议、看板自动跑）；第三关键决策留人——坚持审批闸门，系统能准备发不发人判断，绝不自动对外。\n最大误区是很多人把 AI 当'买工具'，我当'工作方式重构'。我自己就是案例：用 WorkBuddy+MCP 把 HR 流程自动化，用 AI 做分镜内容（AI 漫剧），真的在用。\n越来越确定：AI 落地瓶颈不是模型能力，是人不愿改工作方式 + 数据口径混乱。所以 HR 在 AI 时代不该退场，要当'采纳推动者'。"},
  {cat:"cog", q:"你怎么理解组织 / 管理？", a:"好组织是让普通人也能做对事的结构；管理是通过别人拿结果、且让别人也成长。\n结合我陪跑技术 leader 的经验：我不替他们管人，而是用数据（看板、参与深度）帮他们看见团队状态，把管理动作从'感觉'变'依据'。\n组织设计上我偏'机制优先'——用审批闸门、分层过滤这类机制减少对人的依赖，比靠个人自觉稳。"},

  // ===== 残留 =====
  {cat:"resid", q:"你没有下属，怎么推动不汇报给你的技术 leader 配合你？", a:"靠的不是职权，是用他的语言给他价值。\n第一步搞清他卡在哪——没看到价值 or 怕增负担，解法不同。\n第二步用数据说话：推 AI 文化拿他团队在别的活动参与数据，指出'你这块是盲区'，让他自己觉得该动。\n第三步找他团队里的布道师——peer 影响 peer 比 HR 自上而下有效得多，布道师机制核心。\n第四步给最小可行动作，不要求全员，先一个低风险场景出成绩，用结果吸引不是 KPI 压。\n关键边界：尊重业务节奏，HR 是赋能不是考核——压出来的配合也是假的。"},
  {cat:"resid", q:"HR 常被说'花钱不产粮'，你怎么证明你的工作有 business impact？", a:"三个动作把 HR 从成本中心叙事拽出来：\n第一用看板反推资源投放——覆盖盲区被数据暴露后，培训资源从均匀撒变往缺口投，省的是无效投入；\n第二用自动化降风险成本——答辩自动化把人工漏跟的事故风险兜掉，一次会议出错的隐性成本远高于系统搭建；\n第三用 AI 落地提人效——【待补：具体人效提升数字】。\n原则：每个 HR 动作都接到'组织效能'这个账上，不是'办了多少场活动'。活动场次是最易虚的指标，我尽量不看它。"},
  {cat:"resid", q:"你做看板、答辩系统，掌握大量员工数据，怎么保证合规？", a:"这条我划很死，HR 碰数据出事是信任崩塌。四件事：\n第一数据最小化——看板只看必要参与字段，不收集无关隐私；\n第二权限隔离——敏感信息（如答辩结论）分级，只有相关人可见；\n第三用途透明——员工知情数据用在哪、不外流；\n第四脱敏展示——看板层面聚合呈现，不暴露个人。\n技术上我也克制：系统能自动准备，但对外动作过审批闸门，绝不自动发含个人信息的消息。合规不是流程尾巴，是设计系统时的第一约束。"},
  {cat:"resid", q:"说个你真实的缺点，别拿'太追求完美'糊弄。", a:"我早期有个毛病：框架搭得快，但对技术实现的细节边界有时估不足，导致跟技术对齐时要返工。比如最初定义需求时以为某自动化节点很简单，结果技术说有坑，得回头改 PRD。\n现在用机制治：任何需求开工前，先跟技术把'能不能做、边界在哪'对齐清楚再写定稿，不凭感觉估。\n这不算灭顶缺点，但让我从'想到就冲'变成'冲之前先验证边界'——跟我坚持审批闸门同一套克制。"},

  // ===== 边角 =====
  {cat:"edge", q:"5 年后你想成为什么？给你 3 倍资源会做什么？", a:"我不空谈职级，说能力画像：5 年后想成为'组织效能 / HR 科技'方向能扛事的人——不是管更多人，是把'HR 流程产品化 + AI 落地'做成可复制方法论，能跨团队跨业务搬。\n如果真给 3 倍资源，不铺更多活动，投两个方向：一是预测性 People Analytics——从'看后视镜'（覆盖率描述）走到'看前视镜'（流失预警、介入时机）；二是 AI 采纳的变革管理——帮更多团队跨过'工具买了不用'这道坎。\n两个都不是烧钱堆量，是把验证过的东西做深。"},
  {cat:"edge", q:"同事或 leader 怎么评价你？给自己贴个标签？", a:"正面说我'用数据说话、推得动事、边界清楚'——有技术 leader 原话'你不像传统 HR，能聊清楚 why 再让我配合'。\n反面也有：我有时太急，框架快但跟技术对齐细节偶尔返工——前面也讲了，现在用'开工前先对齐边界'机制治。\n标签大概是：结果导向的桥梁型 HR，冲得快但已学会先验证边界。"},
  {cat:"edge", q:"你觉得你们公司 / 我们公司 HR 做得怎么样？", a:"这条我克制——不评价个体或团队好坏，更习惯从机制层面看。\n比如我在体系里学到最有用的是 HR 的系统化能力（培训、晋升通道都很成体系），这正是我把看板、自动化做起来的底子；同时也看到技术团队 HR 要更贴业务痛点才有效，是我自己的补位点。\n对贵司具体情况不便下判断，反而正是我想反向确认的——贵司当前 HR 最大痛点是什么、机制上在推什么，我判断能力能不能直接补上。我不挑刺，关心匹配。"},
  {cat:"edge", q:"你还有什么想补充的？最后想说什么？", a:"两句话收：第一，今天聊下来更确认——我是'HR 业务 × 产品化 / 自动化'的桥梁型的人，贵司这岗位要的正是这条线，不是我硬凑。\n第二，前面所有主张背后都有真实项目和可验证数字，任何一条您想深挖我能展开到动作层。\n如果方便，想把反向提问那三个（背什么指标 / 最大痛点 / 在推的数字化项目）也聊一下，确认我们是不是真同频。"},

  // ===== 终极死角 =====
  {cat:"ultimate", q:"leader 让你做不认同的 HR 动作（如用话术诱导不合理裁员）怎么办？", a:"先分'不认同'是价值观冲突还是方法分歧。方法分歧好办——给替代方案，同样达成业务目标换更坦诚沟通方式，既保业务也保信任。\n如果是真价值观冲突（违法违规或严重损人），底线是不执行、但给建设性出口：私下跟 leader 讲清风险和替代路径争取改方式；若坚持，我有权拒绝并说明——HR 信誉一旦为一次动作透支后面全废。\n但我不会当场对抗闹僵——先对齐、再谏、留记录，这是职业处理。我做审批闸门也是这逻辑：系统能准备，越界动作人把关。"},
  {cat:"ultimate", q:"期望薪资多少？现薪资多少？低于期望会来吗？", a:"现薪资我如实说【待补】，但我更看总包和成长空间，不是单看月薪。\n期望上，基于【待补：市场 / 职级对标】给一个区间，不漫天要价也不自贬。\n低于期望来不来——取决于'低多少'和'这岗能不能让我长出长不出来的能力'。小幅差异但匹配度和成长够我倾向来；差太多坦诚聊不勉强。\n原则：薪酬聊清楚，但不拿它当唯一决策项。"},
  {cat:"ultimate", q:"如果给你 offer，前 90 天你打算怎么干？", a:"三阶段：0–30 天听和看——不搞大动作，先摸清人才结构、业务痛点和现有 HR 动作真实效率，用数据而非感觉；\n30–60 天找切口——挑一个高共识、低阻力点（比如某重复流程先做自动化）出小成绩建信任；\n60–90 天立主线——把产品化 / AI 能力落到 1–2 个主干项目形成可持续节奏。\n核心是不一来就颠覆，先用小胜换信任再上主线——跟我推 AI 文化用布道师小切口同一逻辑。"},
  {cat:"ultimate", q:"你说的数据真实吗？能证明吗？", a:"能。所有量化主张背后都有源数据——看板接学员明细，答辩跑通有会议号和记录，沙龙有报名和复盘文档。任何一条您想验证我能讲清口径和来源。\n而且我前面坦诚说了哪些数字还在对齐口径（比如采纳率），不把'待对齐'说成'已达成'。HR 碰数据诚信是底线，不会为好看虚报。"},
  {cat:"ultimate", q:"AI 这么强，你的岗位会不会没了？", a:"不会消失但会重塑。AI 吃掉的是'事务执行层'——正好我已用自动化兜掉的那些（答辩跟进、统计）。真正增值的 HR 能力——诊断组织痛点、设计激励机制、推动人改工作方式——AI 替代不了，反而因执行层被吃掉 HR 能把精力放这上面。\n所以我不是被取代那批，是主动把可替代部分交出去、往不可替代层走的那批。这也是一直做产品化和 AI 落地的原因——给自己升值不是等被替。"},
  {cat:"ultimate", q:"⚠️ 婚育 / 年龄 / 家庭计划类问题（违法题）怎么应对？", a:"这类问题在法律上不该问、也不该正面接核心。优雅回避模板：'我目前全部精力能投入工作，长期规划我更想聊职业本身。'\n不撒谎、不接茬、把球导回岗位。若面试官坚持，可补一句'我对这份工作的投入度您不用担心'。"},

  // ===== 极低频 =====
  {cat:"lowfreq", q:"现场给我看一个你做的东西，比如看板或 PRD。", a:"我正好带了（提前备好截图 / 链接）。讲博闻看板——最代表'定义口径'能力。\n多数培训看板只看参与人次虚高，我重定义三指标：去重人数和参与人次分开、剔除 <15 分钟无效参会、算人均参与深度（总有效时长 ÷ 去重人数）。\n技术上用 Python 脚本比对源数据（学员明细）一致性，确保看板数和底层对得上——脚本核心不是我写，但我能读逻辑、能验证数据。\n角色明确：口径和验收我定，跟业务 leader 对齐后落地。您看到的不是'漂亮覆盖率 95%'，是'覆盖率背后我敢解释每个数字怎么来的'。\n（问 PRD 切答辩自动化：节点触发 + MCP 串联 + 审批闸门，同样'我定需求定验收'逻辑。）"},
  {cat:"lowfreq", q:"你最近读了什么书，或者关注什么？", a:"坦白不堆理论书，学习很'动手派'——日常用 WorkBuddy+MCP 搭 HR 自动化，跑通一个流程比读十篇方法论学得实在。\n信息源盯两类：一是 AI 应用落地的一手案例（不是模型发布，是'谁真用 AI 把活干好了'）；二是 HR 科技 / People Analytics 前沿动态。\n最近最有用的'阅读'其实是做 AI 布道师机制——从一线实践反推变革管理怎么做，比书上讲的具体。原则：学为用不为谈资。"},
  {cat:"lowfreq", q:"假设公司突发员工危机（核心骨干意外 / 集体离职风波），HR 怎么应对？", a:"框架四步：\n第一稳事实——先确认信息真假，不传谣不掩盖，HR 第一个要冷静；\n第二分责任——HR 不是救火队长是调度中枢，把法务、业务、公关各放对位置；\n第三保合规——涉及员工数据、劳工权益环节绝不踩线（又提数据合规）；\n第四后沟通——对内安抚讲真话、对外统一口径。\n经历过的都是小危机，但原则通用：HR 在危机里价值是'让对的人在对的时刻做对的动作'，不是自己冲上去扛。"},
  {cat:"lowfreq", q:"如果让你从零设计一个员工体验项目，你会怎么做？", a:"用自己验证过的方法论不拍脑袋：\n第一步找真痛点——用数据 + 访谈，如技术团队常有的'看不到成长路径'不是我猜的；\n第二步定义可观察行为——不做'关爱员工'口号，定义成'每月一次成长复盘被记录'；\n第三步机制兜底——把行为和晋升 / 认可挂钩，不然口号敌不过 KPI；\n第四步小切口试点——找愿意尝鲜团队用布道师 peer 影响，不出成绩不扩；\n第五步数据验收闭环——看行为真变没变不是看办了没办。\n举例设计'技术人成长可见化'项目：用看板让技术同事看见自己能力和项目轨迹，直击'前途看不见'痛点。核心：不做热闹做可验证行为改变。"},
  {cat:"lowfreq", q:"你能接受出差或 relocation 吗？", a:"出差我理解是岗位常态，多地支持我能接受，具体频率可对一下。\nRelocation 看城市、时长和家庭安排——我目前 base 深圳【待补：如涉及换城你的真实可接受度】，不是不能谈，是得看具体方案值不值。\n原则是不 preemptively 拒绝也不空承诺，先确认清楚范围再给准话，免得后面扯皮。"},

const grid = document.getElementById('grid');
const search = document.getElementById('search');
const countEl = document.getElementById('count');
let activeCat = 'all';

function render(){
  const kw = search.value.trim().toLowerCase();
  grid.innerHTML = '';
  let shown = 0;
  DATA.forEach((item, i) => {
    if(activeCat !== 'all' && item.cat !== activeCat) return;
    if(kw && !(item.q.toLowerCase().includes(kw) || item.a.toLowerCase().includes(kw))) return;
    const c = CAT[item.cat];
    const card = document.createElement('div');
    card.className = 'card';
    // 把 【待补】 变成可编辑
    const aHtml = item.a.replace(/【待补】/g, '<span class="todo" contenteditable="true" data-i="'+i+'">待补</span>');
    card.innerHTML = '<span class="pill" style="background:'+c.color+'">'+c.label+'</span>'
      + '<p class="q">'+item.q+'</p>'
      + '<p class="a">'+aHtml+'</p>';
    grid.appendChild(card);
    shown++;
  });
  countEl.textContent = '当前显示 '+shown+' / '+DATA.length+' 问';
  // 滚动渐入
  const io = new IntersectionObserver((entries)=>{
    entries.forEach(e=>{ if(e.isIntersecting){ e.target.classList.add('in'); io.unobserve(e.target);} });
  }, {threshold:.08});
  document.querySelectorAll('.card').forEach(c=>io.observe(c));
  // 恢复本地保存的待补
  document.querySelectorAll('.todo').forEach(t=>{
    const k = 'iv_todo_'+t.dataset.i;
    const v = localStorage.getItem(k);
    if(v!==null) t.textContent = v;
    t.addEventListener('input', ()=>localStorage.setItem(k, t.textContent));
  });
}

document.getElementById('toolbar').addEventListener('click', e=>{
  if(e.target.classList.contains('chip')){
    document.querySelectorAll('.chip').forEach(c=>c.classList.remove('active'));
    e.target.classList.add('active');
    activeCat = e.target.dataset.cat;
    render();
  }
});
search.addEventListener('input', render);
render();
</script>
