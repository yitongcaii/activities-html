<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>培训运营平台 · 首页</title>
<style>
  *{ box-sizing:border-box; }
  /* 底色：柔化品牌蓝——提亮降饱和 + 顶部柔白光晕、底部深蓝减弱，整体更通透不闷 */
  body{ margin:0; font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
        background-color:#1f82d6;
        background-image:
          radial-gradient(1700px 1850px at 50% -22%, rgba(255,255,255,.46) 0%, rgba(255,255,255,0) 86%),
          radial-gradient(820px 640px at 86% 108%, rgba(0,40,110,.08) 0%, rgba(0,40,110,0) 52%),
          linear-gradient(180deg, #5aa6ec 0%, #2f93e2 50%, #1f82d6 100%);
        background-attachment:fixed;
        color:#fff; min-height:100vh; overflow-x:hidden; }
  .wrap{ max-width:1340px; margin:0 auto; padding:28px 28px 64px; }
  /* 方向6 贴纸隐喻：标题做成一枚欢迎贴纸卡，像贴在首页上（不旋转，正放更稳） */
  /* 标题去卡化：直接铺蓝底白字，去掉白贴纸卡，破双框对称 */
  .home-title{ text-align:center; margin-bottom:40px; }
  .home-title h2{ font-size:38px; font-weight:800; margin:0 0 12px; color:#ffffff; letter-spacing:.2px; text-shadow:0 2px 14px rgba(0,32,80,.30); }
  /* 方向3 会挥手的欢迎表情：和全页 emoji 母语一致 */
  .home-title h2 .wave{ display:inline-block; margin-right:9px; transform-origin:72% 82%;
                        animation:waveHi 1.3s ease-in-out infinite; }
  @keyframes waveHi{ 0%,100%{ transform:rotate(-12deg); } 50%{ transform:rotate(14deg); } }
  .home-title p{ margin:18px 0 0; font-size:15px; color:rgba(255,255,255,.95); text-shadow:0 1px 6px rgba(0,40,90,.55); }

  /* 弹性曲线 + 焦点缓动 */
  :root{ --eb: cubic-bezier(0.34, 1.56, 0.64, 1); --ef: cubic-bezier(0.22, 0.61, 0.36, 1); }

  /* 文件夹间距：column-gap 加大到 64px，同时容器加宽，保证文件夹本身不变小 */
  .folder-grid{ display:grid; grid-template-columns:repeat(4,1fr); column-gap:64px; row-gap:34px;
                align-items:end; margin-bottom:60px; transition:opacity .3s; }
  .fcard{ --c:#888; display:flex; flex-direction:column; align-items:center; width:100%;
          background:transparent; border:none; padding:0; font-family:inherit; cursor:pointer;
          transition:transform .3s var(--eb), opacity .3s var(--ef); position:relative; }
  .fcard:hover{ transform:translateY(-8px); }
  .fcard:focus-visible{ outline:3px solid rgba(10,58,107,.5); outline-offset:8px; border-radius:16px; }

  /* 聚焦效应：悬停某张，其余淡出 */
  .folder-grid:has(.fcard:hover) .fcard:not(:hover),
  .folder-grid.demo-focus .fcard:not(.demo-hover){ opacity:.5; filter:saturate(.8) brightness(.94); }

  /* 文件夹舞台：背板 -> 内容物 -> 前面板，三层叠；加透视做开盖 */
  .fstage{ position:relative; width:100%; height:322px; perspective:900px;
           display:flex; align-items:flex-end; justify-content:center;
           border-radius:32px;
           filter:drop-shadow(0 12px 22px rgba(0,30,72,.06));
           transition:filter .35s var(--ef); }
  /* 注：原 .fstage::before 圆角遮罩背板已删——蓝底下会显成透明框，圆角现由 .fbk/.ffr 自身 border-radius 保证 */
  /* 文件夹中央按钮：勾人版（焦点放大 + 干净立体 + 白色扩散慢呼吸 + ›行动暗示 + 按压下陷） */
  .fbtn{ position:absolute; left:50%; bottom:86px; transform:translateX(-50%);
         z-index:5; padding:13px 20px; border-radius:999px; white-space:nowrap;
         display:inline-flex; align-items:center; gap:9px; cursor:pointer; user-select:none;
         background:linear-gradient(180deg, #ffffff 0%, #eaf0f8 100%);
         color:#16324f; font-size:16px; font-weight:800; letter-spacing:.3px;
         border:1px solid rgba(255,255,255,.9);
         box-shadow:0 10px 22px rgba(8,24,56,.30), inset 0 1px 0 rgba(255,255,255,.9);
         transition:transform .26s var(--eb), box-shadow .26s, filter .26s; }
  /* 模块同色小圆点：唯一彩色点缀，克制不艳（用子元素，避免占用伪元素） */
  .fdot{ width:9px; height:9px; border-radius:50%; flex:none; background:var(--c);
         box-shadow:0 0 0 3px rgba(255,255,255,.55); }
  /* 优雅慢呼吸：白色扩散光环，非霓虹、不晃眼，给眼睛落点 */
  .fbtn::before{ content:""; position:absolute; left:50%; top:50%;
         width:100%; height:100%; transform:translate(-50%,-50%); border-radius:999px;
         pointer-events:none; animation:btnBreathe 3s var(--ef) infinite; }
  @keyframes btnBreathe{
    0%   { box-shadow:0 0 0 0 rgba(255,255,255,.50); }
    60%  { box-shadow:0 0 0 11px rgba(255,255,255,0); }
    100% { box-shadow:0 0 0 0 rgba(255,255,255,0); }
  }
  /* 右侧 › ：行动暗示，点我会进去 */
  .fbtn::after{ content:"›"; font-size:20px; font-weight:800; line-height:1;
         color:rgba(22,50,79,.5); transform:translateX(0);
         transition:transform .25s var(--eb), color .25s; }
  .fcard:hover .fbtn, .fcard.demo-hover .fbtn{
         transform:translateX(-50%) translateY(-4px) scale(1.04); filter:brightness(1.03);
         box-shadow:0 18px 30px rgba(8,24,56,.38), inset 0 1px 0 rgba(255,255,255,.9);
         animation:none; }
  .fcard:hover .fbtn::after, .fcard.demo-hover .fbtn::after{ transform:translateX(4px); color:rgba(22,50,79,.8); }
  /* 按下下陷：给“能按”的触觉暗示 */
  .fcard:active .fbtn{ transform:translateX(-50%) translateY(0) scale(.97);
         box-shadow:0 5px 12px rgba(8,24,56,.32), inset 0 1px 0 rgba(255,255,255,.9);
         animation:none; }
  /* 文件夹投影：静态极淡浅灰，hover 略加深（emoji 自身阴影不在此列） */
  .fcard:hover .fstage, .fcard.demo-hover .fstage{ filter:drop-shadow(0 18px 32px rgba(0,30,72,.10)); }
  .fbk,.ffr{ position:absolute; bottom:0; left:50%; transform:translateX(-50%);
             height:300px; width:auto; display:block; border-radius:32px; }
  .fbk{ z-index:1; }
  .ffr{ z-index:3; transform-origin:bottom center;
        transition:transform .4s var(--eb), opacity .35s var(--ef); }

  /* A. 开盖：口袋前沿翻让 + 内容物弹跳冒出 */
  .fcard:hover .ffr, .fcard.demo-hover .ffr{ transform:translateX(-50%) translateY(12px) rotateX(14deg); opacity:.92; }

  /* 开口线在 stage 底部上方 173.9px；内容物底边 182px */
  .ftop{ position:absolute; left:0; right:0; bottom:182px; height:130px;
         z-index:2; display:flex; align-items:flex-end; justify-content:center;
         transition:transform .4s var(--eb); }
  .fcard:hover .ftop, .fcard.demo-hover .ftop{ transform:translateY(-18px) scale(1.06); }
  .ftop span{ position:relative; display:block; line-height:1;
              filter:drop-shadow(0 4px 8px rgba(0,28,66,.42));
              transition:transform .4s var(--eb); }
  .ftop span:nth-child(1){ font-size:66px;  transform:translateY(8px) rotate(-13deg);  margin-right:-10px; }
  .ftop span:nth-child(2){ font-size:108px; transform:translateY(0) rotate(3deg);      margin:0 -10px; z-index:2; }
  .ftop span:nth-child(3){ font-size:72px;  transform:translateY(6px) rotate(11deg);   margin-left:-10px; }
  /* 错落跳动：中间先动，两侧稍后（stagger） */
  .fcard:hover .ftop span:nth-child(1), .fcard.demo-hover .ftop span:nth-child(1){ transform:translateY(-6px) rotate(-16deg) scale(1.12); transition-delay:.09s; }
  .fcard:hover .ftop span:nth-child(2), .fcard.demo-hover .ftop span:nth-child(2){ transform:translateY(-14px) rotate(2deg) scale(1.16); transition-delay:0s; }
  .fcard:hover .ftop span:nth-child(3), .fcard.demo-hover .ftop span:nth-child(3){ transform:translateY(-8px) rotate(14deg) scale(1.12); transition-delay:.14s; }

  /* 按下反馈 */
  .fcard:active{ transform:translateY(-3px) scale(.988); transition-duration:.12s; }

  /* 蓝底上文字统一走白色，hover 抬亮 */
  .flabel{ margin-top:22px; height:28px; line-height:28px;
           font-size:18px; font-weight:600; color:rgba(255,255,255,.98); white-space:nowrap;
           text-shadow:0 2px 12px rgba(0,24,60,.55);
           transition:color .25s, letter-spacing .25s, text-shadow .25s; }
  .fcard:hover .flabel, .fcard.demo-hover .flabel{ color:#fff; letter-spacing:1.4px;
           text-shadow:0 3px 16px rgba(0,24,60,.6); }

  /* C. 进入过渡 */
  .fcard.opening{ transform:scale(1.08); z-index:6; }
  .folder-grid.has-open .fcard:not(.opening){ opacity:.2; filter:saturate(.7); }
  .enter-overlay{ position:fixed; inset:0; z-index:40; display:flex; flex-direction:column;
                 align-items:center; justify-content:center; gap:18px;
                 background:radial-gradient(circle at 50% 40%, #ffffff 0%, var(--c,#ccc) 200%);
                 transform-origin:var(--ox,50%) var(--oy,50%);
                 transform:scale(.10); opacity:0; border-radius:50%;
                 pointer-events:none;
                 transition:transform .55s var(--ef), opacity .35s var(--ef), border-radius .55s var(--ef); }
  .enter-overlay.show{ transform:scale(1); opacity:1; border-radius:0; pointer-events:all; }
  .ov-icon{ font-size:120px; line-height:1; transform:translateY(20px) scale(.6); opacity:0;
            transition:transform .55s var(--eb) .05s, opacity .4s .05s; }
  .enter-overlay.show .ov-icon{ transform:translateY(0) scale(1); opacity:1; }
  .ov-title{ font-size:32px; font-weight:800; color:#3a3f4f; transform:translateY(16px); opacity:0;
             transition:transform .5s var(--eb) .12s, opacity .4s .12s; }
  .enter-overlay.show .ov-title{ transform:translateY(0); opacity:1; }
  .ov-sub{ font-size:15px; color:#7a7f8c; transform:translateY(14px); opacity:0;
           transition:transform .5s var(--eb) .2s, opacity .4s .2s; }
  .enter-overlay.show .ov-sub{ transform:translateY(0); opacity:1; }

  /* 底部提示卡：蓝底上的磨砂玻璃 */
  /* 待办卡玻璃拟态：半透明白 + 模糊 + 白色高光边，融入蓝底 */
  .home-todo{ max-width:660px; margin:0 auto; border-radius:24px; padding:24px 30px;
              background:linear-gradient(180deg, rgba(255,255,255,.34) 0%, rgba(255,255,255,.16) 100%);
              border:1px solid rgba(255,255,255,.42);
              backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
              box-shadow:0 16px 36px rgba(0,30,72,.30),
                         inset 0 1px 0 rgba(255,255,255,.55),
                         inset 0 -1px 0 rgba(255,255,255,.10); }
  .home-todo h3{ font-size:18px; font-weight:700; margin:0 0 14px; color:#ffffff; text-shadow:0 2px 8px rgba(0,30,72,.35); }
  .home-todo ul{ list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:11px; }
  .home-todo li{ font-size:15px; line-height:1.7; color:rgba(255,255,255,.97); text-shadow:0 1px 4px rgba(0,30,72,.45); }
  /* 待办改用 emoji 编号，去掉方块前缀 */
  /* 福利外置：待办卡下一道半透明小横条，主体干净、福利不抢眼 */
  /* 底部福利条：纯白实心胶囊，深蓝字，在蓝底上最跳、最干净 */
  .todo-welfare-bar{ position:relative; max-width:580px; margin:16px auto 0; padding:13px 26px;
                     border-radius:999px; text-align:center;
                     background:#fff; border:1px solid rgba(255,255,255,.6);
                     font-size:15px; font-weight:700; color:#0a3a6b;
                     box-shadow:0 10px 24px rgba(0,30,72,.22);
                     transition:transform .25s var(--eb); }
  .todo-welfare-bar:hover{ transform:translateY(-2px); }
  .todo-welfare-bar .wf-hl{ color:#0066C8; font-weight:800; }

  @media(max-width:1240px){ .folder-grid{ column-gap:40px; } .wrap{ max-width:1160px; } }
  @media(max-width:980px){ .folder-grid{ grid-template-columns:repeat(2,1fr); column-gap:36px; row-gap:48px; } }
  @media(max-width:560px){ .folder-grid{ grid-template-columns:1fr; row-gap:44px; } }

  /* ============ 乙：常驻壳（进模块后隐藏侧栏 + 顶部 tab 随时切 + 返回首页） ============ */
  .shell-view{ display:none; position:fixed; inset:0; flex-direction:column; background:#fff; z-index:30; }
  body.shell-mode .wrap{ display:none; }
  body.shell-mode .shell-view{ display:flex; }
  .shell-top{ display:flex; align-items:center; justify-content:space-between; gap:14px;
              padding:10px 20px; background:linear-gradient(180deg,#3f93e2 0%,#2f84d6 100%);
              box-shadow:0 4px 16px rgba(0,40,90,.22); flex:none; }
  .shell-tabs{ display:flex; gap:9px; flex-wrap:wrap; }
  .stab{ border:none; cursor:pointer; font-family:inherit; font-size:14px; font-weight:700;
         color:#eaf3ff; background:rgba(255,255,255,.14); padding:9px 15px; border-radius:999px;
         transition:background .2s, color .2s, transform .15s; white-space:nowrap; }
  .stab:hover{ background:rgba(255,255,255,.30); }
  .stab.active{ background:#fff; color:#16324f; box-shadow:0 4px 12px rgba(0,30,72,.30); }
  .shell-home{ border:none; cursor:pointer; font-family:inherit; font-size:14px; font-weight:700;
               color:#16324f; background:#fff; padding:9px 16px; border-radius:999px; white-space:nowrap;
               box-shadow:0 4px 12px rgba(0,30,72,.22); transition:transform .15s; }
  .shell-home:hover{ transform:translateY(-1px); }
  .mod-frame{ flex:1 1 auto; width:100%; border:0; background:#fff; display:block; }
  @media(max-width:560px){ .shell-top{ flex-direction:column; align-items:stretch; } }

  /* 管理者（白名单）界面壳 + 底部入口 */
  .admin-shell{ display:none; position:fixed; inset:0; flex-direction:column; background:#fff; z-index:31; }
  body.admin-mode .wrap{ display:none; }
  body.admin-mode .admin-shell{ display:flex; }
  .shell-title{ font-weight:800; color:#fff; font-size:14px; margin-right:4px; opacity:.95; }
  .admin-entry{ max-width:560px; margin:12px auto 0; padding:9px 0; text-align:center;
               font-size:13px; font-weight:400; color:#0066C8; letter-spacing:.5px; cursor:pointer;
               opacity:.92; transition:.2s; }
  .admin-entry:hover{ opacity:1; text-decoration:underline; }

  /* 验收用：模拟态（真实环境走 :hover） */
  .fcard.demo-hover{ transform:translateY(-8px); }
</style>
</head>

    <p>点击文件夹，进入你想使用的模块</p>
  </div>

<script>
  /* 各模块目标页：真实培训平台（localhost:8080 SPA，?tab= 深链自动点亮对应标签页） */
  const MODULE_URLS = {
    submit: 'http://localhost:8080/?tab=submit',     // 提交分享主题
    cal:    'http://localhost:8080/?tab=calendar',   // 报名培训日期
    fb:     'http://localhost:8080/?tab=feedback',   // 学员课后反馈
    mall:   'http://localhost:8080/?tab=mall',       // 积分商城
    admin:  'http://localhost:8080/?tab=admin'       // 后台管理（管理者界面）
  };
  /* 壳内部用短名(submit/cal/fb/mall)索引，但平台 goTab 要真实 tab 名 → 这里桥接 */
  const TAB_OF = { submit:'submit', cal:'calendar', fb:'feedback', mall:'mall', admin:'admin' };
  /* 进模块后注入 iframe 的隐藏样式：同域(壳页与平台同部署在 :8080)才生效，跨域则跳过 */
  const IFRAME_HIDE_CSS = '.sidebar,.sidebar-toggle,.header{display:none !important;} .content{padding-top:16px !important;}';

  const frame = document.getElementById('modFrame');
  let currentKey = null;

  function setActiveTab(key){
    document.querySelectorAll('#shellView .stab').forEach(function(b){ b.classList.toggle('active', b.dataset.tab === key); });
  }
  function enterShell(key){
    if (!MODULE_URLS[key]) return;
    currentKey = key;
    document.body.classList.add('shell-mode');
    setActiveTab(key);
    if (frame.src.indexOf(MODULE_URLS[key]) === -1) frame.src = MODULE_URLS[key];
    history.replaceState(null, '', '?module=' + key);
  }
  function exitShell(){
    document.body.classList.remove('shell-mode');
    currentKey = null;
    try { frame.src = 'about:blank'; } catch(e){}
    history.replaceState(null, '', location.pathname);
  }

  /* iframe 加载完成后注入 CSS 隐藏侧栏/顶栏；同域优先 goTab 直接切 tab */
  frame.addEventListener('load', function(){
    try {
      var d = frame.contentDocument;
      if (!d || !d.head) return;
      var s = d.createElement('style');
      s.textContent = IFRAME_HIDE_CSS;
      d.head.appendChild(s);
      if (currentKey && d.defaultView && typeof d.defaultView.goTab === 'function') d.defaultView.goTab(TAB_OF[currentKey] || currentKey);
    } catch(e){ /* 跨域：无法注入，侧栏保留（仅同域部署才隐藏） */ }
  });

  /* 顶部 tab 切换：同域走 goTab，否则重载到对应 ?tab= */
  document.querySelectorAll('.stab').forEach(function(b){
    b.addEventListener('click', function(){
      var key = b.dataset.tab;
      if (!MODULE_URLS[key]) return;
      currentKey = key; setActiveTab(key);
      history.replaceState(null, '', '?module=' + key);
      try {
        var w = frame.contentWindow;
        if (w && typeof w.goTab === 'function') { w.goTab(TAB_OF[key] || key); return; }
      } catch(e){}
      frame.src = MODULE_URLS[key];
    });
  });
  document.getElementById('shellHome').addEventListener('click', exitShell);

  /* ===== 管理者（白名单）界面：现有 4 模块 + 原始 admin 后台，同域 iframe 嵌 ===== */
  const adminFrame = document.getElementById('adminFrame');
  let currentAdminKey = null;
  /* 预留：后端白名单校验接口（本版直接放行；未来接 server.js 校验后改为返回真实结果） */
  function checkAdminWhitelist(){
    // TODO: 接入后端白名单校验，例如 return fetch('/api/admin/check').then(r=>r.ok);
    return Promise.resolve(true);
  }
  function setActiveAdminTab(key){
    document.querySelectorAll('#adminShellView .stab').forEach(function(b){ b.classList.toggle('active', b.dataset.tab === key); });
  }
  function enterAdminShell(key){
    key = key || 'admin';
    if (!MODULE_URLS[key]) return;
    currentAdminKey = key;
    document.body.classList.add('admin-mode');
    setActiveAdminTab(key);
    if (adminFrame.src.indexOf(MODULE_URLS[key]) === -1) adminFrame.src = MODULE_URLS[key];
    history.replaceState(null, '', '?module=' + key);
  }
  function exitAdminShell(){
    document.body.classList.remove('admin-mode');
    currentAdminKey = null;
    try { adminFrame.src = 'about:blank'; } catch(e){}
    history.replaceState(null, '', location.pathname);
  }
  adminFrame.addEventListener('load', function(){
    try {
      var d = adminFrame.contentDocument;
      if (!d || !d.head) return;
      var s = d.createElement('style');
      s.textContent = IFRAME_HIDE_CSS;
      d.head.appendChild(s);
      if (currentAdminKey && d.defaultView && typeof d.defaultView.goTab === 'function') d.defaultView.goTab(TAB_OF[currentAdminKey] || currentAdminKey);
    } catch(e){}
  });
  document.querySelectorAll('#adminShellView .stab').forEach(function(b){
    b.addEventListener('click', function(){
      var key = b.dataset.tab;
      if (!MODULE_URLS[key]) return;
      currentAdminKey = key; setActiveAdminTab(key);
      history.replaceState(null, '', '?module=' + key);
      try {
        var w = adminFrame.contentWindow;
        if (w && typeof w.goTab === 'function') { w.goTab(TAB_OF[key] || key); return; }
      } catch(e){}
      adminFrame.src = MODULE_URLS[key];
    });
  });
  document.getElementById('adminHome').addEventListener('click', exitAdminShell);
  document.getElementById('adminEntry').addEventListener('click', function(){
    checkAdminWhitelist().then(function(ok){
      if (ok) enterAdminShell('admin');
      else alert('您不在管理者白名单中，无法进入。');
    });
  });

  function openModule(el){
    const key = el.dataset.target;
    const label = el.querySelector('.fbtn').textContent;
    const icon = el.querySelector('.ftop span:nth-child(1)').textContent;
    document.getElementById('grid').classList.add('has-open');
    el.classList.add('opening');
    const ov = document.getElementById('enterOverlay');
    const r = el.getBoundingClientRect();
    ov.style.setProperty('--c', getComputedStyle(el).getPropertyValue('--c'));
    ov.style.setProperty('--ox', (r.left + r.width / 2) + 'px');
    ov.style.setProperty('--oy', (r.top + r.height * 0.5) + 'px');
    document.getElementById('ovIcon').textContent = icon;
    document.getElementById('ovTitle').textContent = label;
    document.getElementById('ovSub').textContent = '正在打开「' + label + '」模块…';
    setTimeout(function(){ ov.classList.add('show'); }, 200);
    /* 过渡层播约 2 秒后进入常驻壳（不整页跳走：首页仍在，可随时返回/切模块） */
    setTimeout(function(){
      closeOverlay();
      enterShell(key);
    }, 2000);
  }
  function closeOverlay(){
    const ov = document.getElementById('enterOverlay');
    ov.classList.remove('show');
    document.getElementById('grid').classList.remove('has-open');
    document.querySelectorAll('.fcard.opening').forEach(function(c){ c.classList.remove('opening'); });
  }
  (function(){
    const q = new URLSearchParams(location.search);
    if(q.get('card')){
      const c = document.querySelector('[data-target="'+q.get('card')+'"]');
      if(c){ document.getElementById('grid').classList.add('demo-focus'); c.classList.add('demo-hover'); }
    }
    if(q.get('enter')){
      const c = document.querySelector('[data-target="'+q.get('enter')+'"]');
      if(c){ setTimeout(function(){ openModule(c); }, 300); }
    }
    if(q.get('module')){
      const k = q.get('module');
      const go = function(){ (k === 'admin') ? enterAdminShell('admin') : enterShell(k); };
      if (MODULE_URLS[k]) setTimeout(go, 300);
    }
  })();
</script>
</body>
</html>
